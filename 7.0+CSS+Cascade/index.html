<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Cascade</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .out-box {
      border: 5px solid rgb(178, 26, 198);
      margin: 10px;
      gap: 20px;
    }
    .inner-box{
      background-color: rgb(179, 9, 6);
    }
    .yelt{
      color: yellow;
    }
    .white-text{
      color: white;
    }
    

  </style>
</head>

<body>
  <div id="outer-box" class="out-box">
    <div class="box">
      <p id="yellowtext">Yellow Text</p>
      <div class="box inner-box">
        <p class="white-text">White Text</p>
      </div>
    </div>
    <div class="box">
      <p  id="Yelt">Yellow Text</p>
      <div class="box inner-box">
        <p class="white-text">White Text</p>
      </div>
    </div>
  </div>
</body>

</html>
